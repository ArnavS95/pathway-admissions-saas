<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathway - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #090d16; color: #f1f5f9; }
        .card-bg { background-color: #111726; border: 1px solid rgba(255, 255, 255, 0.08); }
        .input-bg { background-color: #0d121f; border: 1px solid rgba(255, 255, 255, 0.1); color: #f8fafc; }
        .input-bg:focus { border-color: #6366f1; outline: none; box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2); }
        .btn-primary { background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); transition: opacity 0.2s; }
        .btn-primary:hover { opacity: 0.9; }
        .sidebar-collapsed { width: 0 !important; padding: 0 !important; overflow: hidden; border: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md card-bg rounded-2xl p-8 shadow-2xl">
        <div class="text-center mb-8">
            <span class="bg-indigo-500/10 text-indigo-400 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-indigo-500/30">AI Admissions Platform</span>
            <h1 class="text-3xl font-bold text-white mt-4">Pathway</h1>
            <p class="text-slate-400 text-sm mt-1">Sign in to access your college roadmap.</p>
        </div>

        {% if error %}
        <div class="mb-4 p-3 bg-red-500/10 border border-red-500/30 text-red-400 text-sm rounded-lg text-center">
            {{ error }}
        </div>
        {% endif %}

        {% if success %}
        <div class="mb-4 p-3 bg-emerald-500/10 border border-emerald-500/30 text-emerald-400 text-sm rounded-lg text-center">
            {{ success }}
        </div>
        {% endif %}

        <!-- Tab Switcher -->
        <div class="flex bg-[#0d121f] p-1 rounded-xl mb-6 border border-white/5">
            <button onclick="switchTab('signin')" id="tab-signin-btn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-white bg-[#111726] shadow">Sign In</button>
            <button onclick="switchTab('signup')" id="tab-signup-btn" class="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white">Create Account</button>
        </div>

        <!-- Sign In Form -->
        <form action="/login" method="POST" id="signin-form" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Email Address</label>
                <input type="email" name="email" required placeholder="student@school.edu" class="w-full px-4 py-3 rounded-xl input-bg text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Password</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl input-bg text-sm">
            </div>
            <button type="submit" class="w-full py-3 btn-primary text-white font-semibold rounded-xl text-sm mt-2 shadow-lg shadow-indigo-500/20">Sign In</button>
        </form>

        <!-- Sign Up Form -->
        <form action="/signup" method="POST" id="signup-form" class="space-y-4 hidden">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Email Address</label>
                <input type="email" name="email" required placeholder="student@school.edu" class="w-full px-4 py-3 rounded-xl input-bg text-sm">
            </div>
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-2">Password (Min 6 chars)</label>
                <input type="password" name="password" required placeholder="••••••••" class="w-full px-4 py-3 rounded-xl input-bg text-sm">
            </div>
            <button type="submit" class="w-full py-3 btn-primary text-white font-semibold rounded-xl text-sm mt-2 shadow-lg shadow-indigo-500/20">Create Account</button>
        </form>
    </div>

    <script>
        function switchTab(tab) {
            const signinForm = document.getElementById('signin-form');
            const signupForm = document.getElementById('signup-form');
            const signinBtn = document.getElementById('tab-signin-btn');
            const signupBtn = document.getElementById('tab-signup-btn');

            if (tab === 'signin') {
                signinForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                signinBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-white bg-[#111726] shadow";
                signupBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white";
            } else {
                signinForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-white bg-[#111726] shadow";
                signinBtn.className = "flex-1 py-2 text-sm font-semibold rounded-lg text-slate-400 hover:text-white";
            }
        }
    </script>
</body>
</html>
